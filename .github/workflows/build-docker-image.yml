name: docker-build-image

on:
  push:
    branches:
      - 'master'
    tags:
      - "v*"
  pull_request:
    branches:
      - 'master'

env:
  CACHE_IMAGE: ghcr.io/fdiwg/smt-shiny-cache
  DOCKER_BUILDKIT: 1
  RENV_PATHS_ROOT: ~/.cache/R/renv

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fdiwg/smt-shiny
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            
      - name: Login to image repository
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'fdiwg/smt-shiny'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: image=moby/buildkit:master,network=host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        shell: bash
        env:
          PUBLISH_CACHE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'fdiwg/smt-shiny' }}
        run: |
          CACHE_ARGS=(
            --cache-from "type=registry,ref=$CACHE_IMAGE:latest"
          )

          if [[ "$PUBLISH_CACHE" == "true" ]]; then
            CACHE_ARGS+=(
              --cache-to "type=registry,ref=$CACHE_IMAGE:latest,mode=max"
            )
          fi

          docker buildx build \
            "${CACHE_ARGS[@]}" \
            --tag ghcr.io/fdiwg/smt-shiny:latest \
            --build-arg RENV_PATHS_ROOT=${{ env.RENV_PATHS_ROOT }} \
            --output type=docker,dest=/tmp/docker-image.tar \
            .

      - name: Load Docker image
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'fdiwg/smt-shiny'
        run: |
          docker load -i /tmp/docker-image.tar

      - name: Conditional push Docker image
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'fdiwg/smt-shiny'
        run: |
          TAG_NAME=$(basename ${GITHUB_REF})
          docker tag ghcr.io/fdiwg/smt-shiny:latest ghcr.io/fdiwg/smt-shiny:${TAG_NAME}
          docker push ghcr.io/fdiwg/smt-shiny:latest
          docker push ghcr.io/fdiwg/smt-shiny:${TAG_NAME}
